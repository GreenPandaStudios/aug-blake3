[package]
name = "aug-blake3-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
[lib]
crate-type = ["cdylib"]
path = "src/adapter.rs"
[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["std", "pure"] }
[profile.release]
panic = "unwind"
lto = true
codegen-units = 1
